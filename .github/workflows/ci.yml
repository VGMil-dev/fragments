name: Fragments CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out pull request source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Test release agent validation and package metadata helpers
        run: node --test deploy/production/release-agent/test-release-agent-scripts.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test, typecheck, lint, and build
        run: pnpm exec turbo run test typecheck lint build

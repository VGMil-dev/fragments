name: Fragments CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: fragments_test
          POSTGRES_PASSWORD: fragments_test
          POSTGRES_DB: fragments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fragments_test -d fragments_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fragments_test:fragments_test@localhost:5432/fragments_test?schema=public
    permissions:
      contents: read
    steps:
      - name: Check out pull request source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production and isolated QA Compose profiles
        env:
          BETTER_AUTH_SECRET: fragments-ci-config-validation-secret-32-characters
          BETTER_AUTH_URL: https://fragments.example.invalid
          PUBLIC_APP_URL: https://fragments.example.invalid
          FRAGMENTS_POSTGRES_PORT: "55432"
        run: |
          set -euo pipefail
          cd deploy/production
          temporary_env_files=(.env.api .env.postgres .env.migrate .env.test-migrate .env.backup .env.restore .env.bootstrap .env.test-api)
          project=fragments-f21-compose-smoke
          cleanup() {
            docker compose -p "$project" -f docker-compose.yml down --volumes >/dev/null 2>&1 || true
            rm -f "${temporary_env_files[@]}"
          }
          trap cleanup EXIT
          touch "${temporary_env_files[@]}"
          cat > .env.postgres <<'EOF'
          POSTGRES_PASSWORD=fragments-ci-smoke
          FRAGMENTS_PROD_MIGRATOR_PASSWORD=fragments-ci-smoke
          FRAGMENTS_PROD_RUNTIME_PASSWORD=fragments-ci-smoke
          FRAGMENTS_PROD_BACKUP_PASSWORD=fragments-ci-smoke
          FRAGMENTS_TEST_MIGRATOR_PASSWORD=fragments-ci-smoke
          FRAGMENTS_TEST_RUNTIME_PASSWORD=fragments-ci-smoke
          FRAGMENTS_TEST_BACKUP_PASSWORD=fragments-ci-smoke
          FRAGMENTS_RESTORE_PASSWORD=fragments-ci-smoke
          EOF
          docker compose -p "$project" --profile qa -f docker-compose.yml config --quiet
          docker compose -p "$project" -f docker-compose.yml up -d --wait postgres
          databases=$(docker compose -p "$project" -f docker-compose.yml exec -T postgres psql -U fragments_bootstrap -d postgres --tuples-only --no-align --command "SELECT count(*) FROM pg_database WHERE datname IN ('fragments_prod','fragments_test')")
          roles=$(docker compose -p "$project" -f docker-compose.yml exec -T postgres psql -U fragments_bootstrap -d postgres --tuples-only --no-align --command "SELECT count(*) FROM pg_roles WHERE rolname IN ('fragments_prod_migrator','fragments_prod_runtime','fragments_prod_backup','fragments_test_migrator','fragments_test_runtime','fragments_test_backup','fragments_restore')")
          test "$databases" = 2
          test "$roles" = 7

      - name: Apply the Prisma schema to the disposable test database
        run: pnpm --filter @fragments/api prisma:migrate:deploy

      - name: Test release policy and PostgreSQL backup script
        run: node --test deploy/production/release-agent/test-release-agent-scripts.mjs deploy/production/release-agent/test-backup-script.mjs

      - name: Verify PostgreSQL backup restore round trip
        env:
          PGPASSWORD: fragments_test
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          restore_db=fragments_restore_validation
          cleanup() {
            docker run --rm --network host --env PGPASSWORD postgres:18.6 dropdb --if-exists --host localhost --username fragments_test "$restore_db" >/dev/null 2>&1 || true
            rm -f "$archive"
          }
          trap cleanup EXIT
          docker run --rm --network host --user "$(id -u):$(id -g)" --env PGPASSWORD --volume "$archive:/tmp/fragments.dump" postgres:18.6 pg_dump --host localhost --username fragments_test --dbname fragments_test --format custom --no-owner --no-acl --file /tmp/fragments.dump
          docker run --rm --network host --env PGPASSWORD postgres:18.6 createdb --host localhost --username fragments_test "$restore_db"
          docker run --rm --network host --user "$(id -u):$(id -g)" --env PGPASSWORD --volume "$archive:/tmp/fragments.dump:ro" postgres:18.6 pg_restore --exit-on-error --no-owner --no-acl --host localhost --username fragments_test --dbname "$restore_db" /tmp/fragments.dump
          docker run --rm --network host --env PGPASSWORD postgres:18.6 psql --host localhost --username fragments_test --dbname "$restore_db" --set ON_ERROR_STOP=1 --tuples-only --no-align \
            --command "SELECT (to_regclass('public.user') IS NOT NULL AND to_regclass('public._prisma_migrations') IS NOT NULL)" | grep -qx t

      - name: Test release agent state machine
        run: python3 -m unittest discover -s deploy/production/release-agent -p 'test_*.py'

      - name: Verify release metadata reaches Vite through Turbo
        run: node --test deploy/production/release-agent/test-turbo-release-metadata.mjs

      - name: Test, typecheck, lint, and build
        run: pnpm exec turbo run test typecheck lint build

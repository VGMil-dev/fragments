name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag to build, for example v0.4.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fragments-release-build
  cancel-in-progress: false

jobs:
  build-web:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted workflow branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and source commit
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable vX.Y.Z tag." >&2
            exit 1
          fi
          tag_ref="refs/tags/$RELEASE_TAG"
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "Release tag must be annotated." >&2
            exit 1
          fi
          release_sha="$(git rev-parse "$tag_ref^{commit}")"
          git merge-base --is-ancestor "$release_sha" origin/main
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact tagged commit
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: git checkout --detach "$RELEASE_SHA"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.25.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release policy and synthetic PostgreSQL backup tools
        run: node --test deploy/production/release-agent/test-release-agent-scripts.mjs deploy/production/release-agent/test-backup-script.mjs

      - name: Test release agent state machine
        run: python3 -m unittest discover -s deploy/production/release-agent -p 'test_*.py'

      - name: Build the exact release source
        env:
          FRAGMENTS_RELEASE_TAG: ${{ inputs.tag }}
          FRAGMENTS_RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: pnpm build

      - name: Preserve release artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fragments-web-${{ inputs.tag }}-${{ steps.release.outputs.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 30

name: Fragments release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: fragments-release
  cancel-in-progress: false

jobs:
  verify-build:
    if: github.repository == 'VGMil-dev/fragments'
    runs-on: ubuntu-24.04-arm
    outputs:
      tag_object: ${{ steps.release.outputs.tag_object }}
      commit: ${{ steps.release.outputs.commit }}
    permissions:
      contents: read
    steps:
      - name: Check out the pushed tag commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify new annotated semantic version and exact main commit
        id: release
        env:
          EVENT_CREATED: ${{ github.event.created }}
          EVENT_DELETED: ${{ github.event.deleted }}
          EVENT_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == 'VGMil-dev/fragments' ]]
          [[ "$EVENT_CREATED" == 'true' && "$EVENT_DELETED" == 'false' ]]
          [[ "$RELEASE_REF" == "refs/tags/$RELEASE_TAG" ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          tag_ref="refs/tags/$RELEASE_TAG"
          [[ "$(git cat-file -t "$tag_ref")" == 'tag' ]]
          tag_object="$(git rev-parse "$tag_ref")"
          tag_commit="$(git rev-parse "$tag_ref^{commit}")"
          [[ "$tag_commit" == "$RELEASE_SHA" ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main
          tag_workflow="$(git rev-parse "$tag_ref^{commit}:.github/workflows/release.yml")"
          trusted_workflow="$(git rev-parse "refs/remotes/origin/main:.github/workflows/release.yml")"
          [[ "$tag_workflow" == "$trusted_workflow" ]]
          test -z "$(git status --porcelain)"
          {
            echo "tag=$RELEASE_TAG"
            echo "tag_object=$tag_object"
            echo "commit=$RELEASE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Test release agent validation and package metadata helpers
        run: node --test deploy/production/release-agent/test-release-agent-scripts.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test, typecheck, lint, and build exact release source
        env:
          FRAGMENTS_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          FRAGMENTS_RELEASE_SHA: ${{ steps.release.outputs.commit }}
        run: pnpm exec turbo run test typecheck lint build

      - name: Verify build bundle metadata
        env:
          EXPECTED_TAG: ${{ steps.release.outputs.tag }}
          EXPECTED_SHA: ${{ steps.release.outputs.commit }}
        run: node deploy/production/release-agent/verify-release-bundle.mjs

      - name: Build ARM64 images on an isolated GitHub hosted runner
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          api_image="fragments-api:sha-$RELEASE_SHA"
          web_image="fragments-web:sha-$RELEASE_SHA"
          docker buildx build --platform linux/arm64 --load \
            --file apps/api/Dockerfile \
            --build-arg "SOURCE_REVISION=$RELEASE_SHA" \
            --build-arg "RELEASE_VERSION=$RELEASE_TAG" \
            --tag "$api_image" .
          docker buildx build --platform linux/arm64 --load \
            --file deploy/production/web.Dockerfile \
            --build-arg "SOURCE_REVISION=$RELEASE_SHA" \
            --build-arg "RELEASE_VERSION=$RELEASE_TAG" \
            --tag "$web_image" .
          for image in "$api_image" "$web_image"; do
            test "$(docker image inspect --format '{{.Architecture}}' "$image")" = arm64
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image")" = "$RELEASE_TAG"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$RELEASE_SHA"
          done
          docker save "$api_image" "$web_image" | gzip -1 > "$RUNNER_TEMP/fragments-images.tar.gz"
          node deploy/production/release-agent/create-release-manifest.mjs \
            "$RUNNER_TEMP/fragments-images.tar.gz" \
            "$RUNNER_TEMP/release-manifest.json" \
            '${{ github.run_id }}' \
            '${{ steps.release.outputs.tag }}' \
            '${{ steps.release.outputs.tag_object }}' \
            '${{ steps.release.outputs.commit }}'

      - name: Preserve the verified release package for the protected approval job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fragments-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fragments-images.tar.gz
            ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error
          retention-days: 3

  attest-package:
    needs: verify-build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      - name: Download the verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fragments-release-${{ github.run_id }}
          path: ${{ runner.temp }}/fragments-release

      - name: Sign the exact ARM64 archive with GitHub provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/fragments-release/fragments-images.tar.gz

      - name: Copy the signed Sigstore bundle for offline verification
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE_PATH"
          test -s "$BUNDLE_PATH"
          test "$(wc -c < "$BUNDLE_PATH")" -le 1000000
          install -m 0600 "$BUNDLE_PATH" "$RUNNER_TEMP/fragments-release/fragments-images.attestation.jsonl"
          mkdir -m 0700 "$RUNNER_TEMP/gh-empty"
          export GH_CONFIG_DIR="$RUNNER_TEMP/gh-empty"
          export GH_PROMPT_DISABLED=1
          unset GH_TOKEN GITHUB_TOKEN
          gh attestation verify "$RUNNER_TEMP/fragments-release/fragments-images.tar.gz" \
            --repo VGMil-dev/fragments \
            --bundle "$RUNNER_TEMP/fragments-release/fragments-images.attestation.jsonl" \
            --signer-workflow VGMil-dev/fragments/.github/workflows/release.yml \
            --signer-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

      - name: Publish the offline attestation bundle to the run artifact
        uses: actions/upload-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fragments-release-attestation-${{ github.run_id }}
          path: ${{ runner.temp }}/fragments-release/fragments-images.attestation.jsonl
          if-no-files-found: error
          retention-days: 3

  publish-approved-release:
    needs: [verify-build, attest-package]
    runs-on: ubuntu-24.04
    environment:
      name: fragments-production
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the package from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fragments-release-${{ github.run_id }}
          path: ${{ runner.temp }}/fragments-release

      - name: Download the verified Sigstore bundle from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fragments-release-attestation-${{ github.run_id }}
          path: ${{ runner.temp }}/fragments-release-attestation

      - name: Stage and reverify the offline attestation bundle
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gh-publish-empty
          GH_PROMPT_DISABLED: "1"
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/fragments-release-attestation/fragments-images.attestation.jsonl"
          test -s "$bundle"
          test "$(wc -c < "$bundle")" -le 1000000
          install -m 0600 "$bundle" "$RUNNER_TEMP/fragments-release/fragments-images.attestation.jsonl"
          mkdir -m 0700 "$GH_CONFIG_DIR"
          unset GH_TOKEN GITHUB_TOKEN
          gh attestation verify "$RUNNER_TEMP/fragments-release/fragments-images.tar.gz" \
            --repo VGMil-dev/fragments \
            --bundle "$RUNNER_TEMP/fragments-release/fragments-images.attestation.jsonl" \
            --signer-workflow VGMil-dev/fragments/.github/workflows/release.yml \
            --signer-digest "$EXPECTED_SHA" \
            --source-ref "refs/tags/$EXPECTED_TAG" \
            --source-digest "$EXPECTED_SHA" \
            --deny-self-hosted-runners

      - name: Recheck the approval-gated artifact identity and digest
        env:
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_TAG: ${{ github.ref_name }}
          EXPECTED_TAG_OBJECT: ${{ needs.verify-build.outputs.tag_object }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const f=process.argv[2];const d=crypto.createHash("sha256").update(fs.readFileSync(f)).digest("hex");if(m.repository!=="VGMil-dev/fragments"||m.repositoryId!==1214734354||m.runId!==process.env.EXPECTED_RUN_ID||m.tag!==process.env.EXPECTED_TAG||m.tagObject!==process.env.EXPECTED_TAG_OBJECT||m.commit!==process.env.EXPECTED_SHA||m.archiveSha256!==d||m.platform!=="linux/arm64")process.exit(1);' \
            "$RUNNER_TEMP/fragments-release/release-manifest.json" \
            "$RUNNER_TEMP/fragments-release/fragments-images.tar.gz"

      - name: Publish the approved image package as the public pull queue
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/fragments-release/release-manifest.json" \
            "$RUNNER_TEMP/fragments-release/fragments-images.tar.gz" \
            "$RUNNER_TEMP/fragments-release/fragments-images.attestation.jsonl" \
            --repo VGMil-dev/fragments \
            --verify-tag \
            --title "Fragments $RELEASE_TAG" \
            --notes "Paquete ARM64 verificado. El agente pull local valida la aprobación, la tag y el SHA antes de tocar Fragments."

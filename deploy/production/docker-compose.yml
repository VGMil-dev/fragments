name: fragments

services:
  postgres:
    image: postgres:18.6
    platform: linux/arm64
    env_file:
      - path: .env.postgres
        required: true
        format: raw
    environment:
      POSTGRES_USER: fragments_bootstrap
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fragments-postgres-data:/var/lib/postgresql
      - ./postgres-init/10-create-databases.sh:/docker-entrypoint-initdb.d/10-create-databases.sh:ro
    networks:
      - fragments-db
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    cpus: 1
    mem_limit: 2g
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fragments_bootstrap -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api:
    image: fragments-api:0.1.0-mvp-arm64
    platform: linux/arm64
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: runtime
    env_file:
      - path: .env.api
        required: true
        format: raw
    environment:
      API_PORT: "3000"
      AUTH_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      migrate-test:
        condition: service_completed_successfully
    expose:
      - "3000"
    networks:
      - fragments
      - fragments-db
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    cpus: 0.8
    mem_limit: 2g
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    labels:
      org.opencontainers.image.title: Fragments API
      org.opencontainers.image.version: v0.1.0-mvp
      org.opencontainers.image.revision: 4553ae204160f95dfcb0886fe9741566441f3cbc

  migrate:
    image: fragments-api:0.1.0-mvp-arm64
    platform: linux/arm64
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: runtime
    env_file:
      - path: .env.migrate
        required: true
        format: raw
    entrypoint:
      - /app/apps/api/node_modules/.bin/prisma
    command: [migrate, deploy, --schema, apps/api/prisma/schema.prisma]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fragments-db
    restart: "no"

  migrate-test:
    image: fragments-api:0.1.0-mvp-arm64
    platform: linux/arm64
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: runtime
    env_file:
      - path: .env.test-migrate
        required: true
        format: raw
    entrypoint:
      - /app/apps/api/node_modules/.bin/prisma
    command: [migrate, deploy, --schema, apps/api/prisma/schema.prisma]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fragments-db
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    cpus: 0.4
    mem_limit: 768m

  web:
    image: fragments-web:0.1.0-mvp-arm64
    platform: linux/arm64
    build:
      context: ../..
      dockerfile: deploy/production/web.Dockerfile
      target: runtime
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:8080"
    networks:
      - fragments
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    cpus: 0.2
    mem_limit: 128m
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/__health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    labels:
      org.opencontainers.image.title: Fragments web
      org.opencontainers.image.version: v0.1.0-mvp
      org.opencontainers.image.revision: 4553ae204160f95dfcb0886fe9741566441f3cbc

  bootstrap:
    image: fragments-api:0.1.0-mvp-arm64
    platform: linux/arm64
    profiles:
      - bootstrap
    env_file:
      - path: .env.bootstrap
        required: true
        format: raw
    environment:
      API_PORT: "3000"
      AUTH_ENABLED: "true"
    entrypoint:
      - node
      - apps/api/dist/auth/provision-better-auth-teacher.js
    networks:
      - fragments-db
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    cpus: 0.2
    mem_limit: 512m
    restart: "no"

  backup:
    image: postgres:18.6
    platform: linux/arm64
    profiles:
      - maintenance
    user: "0:0"
    entrypoint:
      - /usr/local/bin/fragments-backup.sh
    env_file:
      - path: .env.backup
        required: true
        format: raw
    environment:
      BACKUP_DIRECTORY: /backups
      RETENTION_DAYS: "14"
    volumes:
      - /var/backups/fragments:/backups:rw
      - ./backup.sh:/usr/local/bin/fragments-backup.sh:ro
    networks:
      - fragments-db
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    cpus: 0.2
    mem_limit: 768m
    restart: "no"

  restore-verify:
    image: postgres:18.6
    platform: linux/arm64
    profiles:
      - maintenance
    user: "0:0"
    entrypoint:
      - /usr/local/bin/fragments-restore-verify.sh
    env_file:
      - path: .env.restore
        required: true
        format: raw
    volumes:
      - /var/backups/fragments:/backups:ro
      - ./restore-verify.sh:/usr/local/bin/fragments-restore-verify.sh:ro
    networks:
      - fragments-db
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    cpus: 0.4
    mem_limit: 768m
    restart: "no"

networks:
  fragments:
    name: fragments-private
    driver: bridge
  fragments-db:
    name: fragments-db-private
    driver: bridge
    internal: true

volumes:
  fragments-postgres-data:
    name: fragments-postgres-data

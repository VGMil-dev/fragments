name: fragments

services:
  api:
    image: fragments-api:0.1.0-mvp-arm64
    platform: linux/arm64
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: runtime
    env_file:
      - path: .env
        required: true
        format: raw
    environment:
      API_PORT: "3000"
      DATABASE_URL: file:/app/data/fragments.sqlite
      AUTH_ENABLED: "true"
    expose:
      - "3000"
    volumes:
      - fragments-data:/app/data
    networks:
      - fragments
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    cpus: 0.8
    mem_limit: 2g
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    labels:
      org.opencontainers.image.title: Fragments API
      org.opencontainers.image.version: v0.1.0-mvp
      org.opencontainers.image.revision: 4553ae204160f95dfcb0886fe9741566441f3cbc

  web:
    image: fragments-web:0.1.0-mvp-arm64
    platform: linux/arm64
    build:
      context: ../..
      dockerfile: deploy/production/web.Dockerfile
      target: runtime
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:8080"
    networks:
      - fragments
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    cpus: 0.2
    mem_limit: 128m
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/__health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    labels:
      org.opencontainers.image.title: Fragments web
      org.opencontainers.image.version: v0.1.0-mvp
      org.opencontainers.image.revision: 4553ae204160f95dfcb0886fe9741566441f3cbc

  bootstrap:
    image: fragments-api:0.1.0-mvp-arm64
    platform: linux/arm64
    profiles:
      - bootstrap
    env_file:
      - path: .env.bootstrap
        required: true
        format: raw
    environment:
      API_PORT: "3000"
      DATABASE_URL: file:/app/data/fragments.sqlite
      AUTH_ENABLED: "true"
    entrypoint:
      - node
      - apps/api/dist/auth/provision-better-auth-teacher.js
    volumes:
      - fragments-data:/app/data
    networks:
      - fragments
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    cpus: 0.2
    mem_limit: 512m
    restart: "no"

  backup:
    image: fragments-api:0.1.0-mvp-arm64
    platform: linux/arm64
    profiles:
      - maintenance
    entrypoint:
      - node
      - /usr/local/bin/fragments-backup.mjs
    user: "0:0"
    environment:
      DATABASE_PATH: /app/data/fragments.sqlite
      BACKUP_DIRECTORY: /backups
      RETENTION_DAYS: "14"
    volumes:
      - fragments-data:/app/data:ro
      - /var/backups/fragments:/backups:rw
      - ./backup.mjs:/usr/local/bin/fragments-backup.mjs:ro
    networks:
      - fragments
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    cpus: 0.2
    mem_limit: 768m
    restart: "no"

networks:
  fragments:
    name: fragments-private
    driver: bridge

volumes:
  fragments-data:
    name: fragments-data
